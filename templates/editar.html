<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Editar aluno</title>

    <link rel="stylesheet" href="../static/style.css">

</head>

<body>

    <div class="container">

        <h1>Editar aluno</h1>

        <form method="POST">

            <label>Nome do Produto</label>

            <input
                type="text"
                name="nome"
                value="{{ produto['nome'] }}"
                required
            >

            <label>Categoria</label>

            <input
                type="text"
                name="categoria"
                value="{{ produto['categoria'] }}"
                required
            >

            <label>Preço</label>

            <input
                type="number"
                name="preco"
                value="{{ produto['preco'] }}"
                required
            >

            <label>Estoque</label>

            <input
                type="number"
                name="estoque"
                value="{{ produto['estoque'] }}"
                required
            >

            <button type="submit">
                Salvar alterações
            </button>

        </form>

        <a href="/" class="voltar">
            Voltar
        </a>

    </div>

</body>

</html>
